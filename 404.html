<style>
  .room-404 {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    text-align: center;
    padding: 2em;
  }
  .room-404-door {
    font-size: 4rem;
    margin-bottom: 0.5em;
    opacity: 0.6;
    filter: grayscale(0.5);
  }
  .room-404-note {
    font-family: "Noto Serif SC", serif;
    font-size: 1.2rem;
    color: #7a6e62;
    max-width: 400px;
    line-height: 1.6;
    padding: 1em 2em;
    background: #faf7f3;
    border-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    transform: rotate(-1deg);
  }
  .dark-mode .room-404-note {
    background: #242120;
    color: #9a8e7e;
  }
  .room-404-door-knob {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #b85a3a;
    margin-left: 4px;
    cursor: grab;
    transition: transform 0.3s;
  }
  .room-404-door-knob:active {
    cursor: grabbing;
    transform: rotate(180deg);
  }
</style>
<div class="room-404">
  <div class="room-404-door">
    🚪<span class="room-404-door-knob"></span>
  </div>
  <div class="room-404-note">
    这个房间还在装修。
  </div>
</div>
<script>
  (function(){
    var knob = document.querySelector('.room-404-door-knob');
    if (!knob) return;
    var isDragging = false;
    knob.addEventListener('mousedown', function(e){
      isDragging = true;
    });
    document.addEventListener('mouseup', function(){
      if (isDragging) {
        isDragging = false;
        knob.style.transform = 'rotate(0deg)';
      }
    });
  })();
</script>
